name: Deploy API

on:
  push:
    branches: [master]
    paths:
      - 'server/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Build native download parser
        run: ./server/build-native.sh

      - name: Test API
        run: |
          python -m pip install -q pytest
          python -m pytest server/tests -q

      - name: Deploy API over SSH
        run: |
          echo "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          tar -czf series_radar.tar.gz -C server series_radar series_radar_downloads_rs
          scp -o StrictHostKeyChecking=no -P "$DEPLOY_PORT" -i deploy_key \
            server/server.py "$DEPLOY_USER@$DEPLOY_HOST:/opt/series-radar-api/server.py"
          scp -o StrictHostKeyChecking=no -P "$DEPLOY_PORT" -i deploy_key \
            series_radar.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/series_radar.tar.gz"
          ssh -o StrictHostKeyChecking=no -p "$DEPLOY_PORT" -i deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/series-radar-api && tar -xzf /tmp/series_radar.tar.gz && find series_radar -name __pycache__ -type d -prune -exec rm -rf {} + && rm -f /tmp/series_radar.tar.gz && systemctl restart series-radar-api.service && sleep 3 && curl -fsS http://127.0.0.1:8090/api/health'
