name: Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    env:
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Need full history for version bump

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-native/local.properties
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-native/**/*.gradle*', 'android-native/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install web dependencies
        working-directory: ./web
        run: npm ci

      - name: Build web
        working-directory: ./web
        run: npm run build

      - name: Sync web assets to Android
        run: |
          mkdir -p android-native/app/src/main/assets
          rm -rf android-native/app/src/main/assets/web
          cp -r web/dist android-native/app/src/main/assets/web

      - name: Build APK
        working-directory: ./android-native
        run: ./gradlew assembleRelease

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG=${GITHUB_REF#refs/tags/}
          else
            # workflow_dispatch: read version from package.json
            VER=$(grep -o '"version": *"[^"]*"' web/package.json | head -1 | cut -d'"' -f4)
            TAG="v$VER"
          fi
          echo "version=${TAG#v}" >> $GITHUB_OUTPUT
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "TAG=$TAG"

      - name: Generate changelog
        id: changelog
        run: |
          TAG=${{ steps.version.outputs.tag }}
          PREV_TAG=$(git describe --tags --abbrev=0 ${TAG}^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..${TAG} --pretty=format:"- %s (%h)" --no-merges)
          else
            CHANGELOG=$(git log ${TAG} --pretty=format:"- %s (%h)" --no-merges)
          fi
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Rename APK for release
        run: |
          cp android-native/app/build/outputs/apk/release/app-release.apk \
             android-native/app/build/outputs/apk/release/series-radar.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Series Radar ${{ steps.version.outputs.tag }}
          body: |
            ## ${{ steps.version.outputs.tag }}
            
            ${{ steps.changelog.outputs.changelog }}
            
            ---
            **Download:** [series-radar.apk](https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/series-radar.apk)
            
            **Install:** Enable "Install unknown apps" for your browser, then open the APK.
            
            **HTTP Install:** `http://31.56.229.237:8080/series-radar.apk` (always latest)
          files: |
            android-native/app/build/outputs/apk/release/series-radar.apk
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy APK to HTTP server
        if: env.DEPLOY_SSH_KEY != ''
        run: |
          echo "$DEPLOY_SSH_KEY" > deploy_key
          chmod 600 deploy_key
          scp -o StrictHostKeyChecking=no -i deploy_key \
            android-native/app/build/outputs/apk/release/app-release.apk \
            "$DEPLOY_USER@$DEPLOY_HOST:/var/www/apk/series-radar.apk"
          ssh -o StrictHostKeyChecking=no -i deploy_key \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "systemctl restart series-radar-share.service"
