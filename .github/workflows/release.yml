name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          ndk-version: r26c
          build-tools-version: 34.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android-native/gradlew

      - name: Build Debug APK
        run: |
          cd android-native
          ./gradlew assembleDebug --console=plain

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: series-radar-apk
          path: android-native/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT

      - name: Generate changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" $PREV_TAG..HEAD)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" -20)
          fi
          echo "CHANGELOG<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: series-radar-apk
          path: .

      - name: Rename APK
        run: mv app-debug.apk series-radar-${{ needs.build.outputs.VERSION }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Series Radar ${{ github.ref_name }}
          body: |
            ## تغییرات
            ${{ needs.build.outputs.CHANGELOG }}

            ## نصب
            فایل APK را دانلود و روی اندروید نصب کنید.
            
            - **حجم**: ~3.8 MB
            - **حداقل اندروید**: 7.0 (API 24)
            - **معماری**: arm64-v8a, armeabi-v7a, x86, x86_64

            ## ویژگی‌های اصلی
            - 📺 **رادار سریال**: ۱۶۶+ سریال با تقویم شمسی/میلادی و ساعت تهران
            - 🎬 **فیلم‌ها**: روی پرده، آنلاین/بلوری، به‌زودی
            - 💰 **گیشه**: بکس‌افیس با بودجه/فروش داخلی/جهانی
            - ⭐ **ستاره‌ها**: سریال، فیلم، پیگیری کیفیت سینما
            - 🔔 **یادآوری**: ۲۴ ساعت قبل، ۰۹:۰۰ تهران
            - 📱 **ویجت**: ۳ آیتم بعدی در هوم‌اسکرین
            - ⬇️ **Pull-to-refresh** در همه صفحات
            - 💾 **Export/Import** بکاپ JSON
            - 🌙 **تم تاریک سینمایی** با ارقام فارسی

          files:
            - series-radar-${{ needs.build.outputs.VERSION }}.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}