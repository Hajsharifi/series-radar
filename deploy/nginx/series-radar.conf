server {
    listen 80;
    listen [::]:80;
    server_name radar.hajsharifi.online;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host:8443$request_uri;
    }
}

server {
    listen 8443 ssl http2;
    listen [::]:8443 ssl http2;
    server_name radar.hajsharifi.online;

    ssl_certificate     /etc/letsencrypt/live/radar.hajsharifi.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/radar.hajsharifi.online/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SERIESRADAR:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /api {
        return 301 /api/;
    }

    location /api/ {
        limit_req zone=series_radar_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8090/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location /apk/ {
        alias /var/www/apk/;
        autoindex off;
        add_header Cache-Control "no-cache";
        types {
            application/vnd.android.package-archive apk;
        }
    }

    location = /series-radar.apk {
        return 302 /apk/series-radar.apk;
    }

    location / {
        root /var/www/radar;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
